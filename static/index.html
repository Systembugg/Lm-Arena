<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e4dccb" />
  <meta name="description" content="room tone is a listening room with no account. Search, stations, shelves, and a log that stays in this browser." />
  <title>room tone</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/room.css" />
</head>
<body data-theme="paper" data-playing="false" data-source="none" data-cueing="false" data-now="closed">
  <a class="skip" href="#app">Skip to program</a>
  <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="grainf">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#grainf)" />
  </svg>

  <div id="app"></div>

  <footer id="dock" class="dock" hidden>
    <button type="button" class="dock-art" data-act="now" aria-label="Open now playing">
      <img id="dock-img" alt="" width="56" height="56" />
    </button>
    <div class="dock-id">
      <button type="button" class="dock-title" id="dock-title" data-act="now">room tone</button>
      <div class="dock-artist" id="dock-artist">Nothing cued</div>
    </div>
    <div class="transport" aria-label="Transport">
      <button type="button" data-act="prev" aria-label="Previous">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h1.6v11H3zM13.2 13.2 6.2 8l7-5.2v10.4z"/></svg>
      </button>
      <button type="button" data-act="toggle" class="play-btn" id="play-btn" aria-label="Play">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path class="ico-play" d="M4.2 2.2v11.6L13.6 8 4.2 2.2z"/>
          <path class="ico-pause" d="M3.6 2.4h2.8v11.2H3.6zM9.6 2.4h2.8v11.2H9.6z"/>
        </svg>
      </button>
      <button type="button" data-act="next" aria-label="Next">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.4 2.5H13v11h-1.6zM2.8 2.8 9.8 8l-7 5.2V2.8z"/></svg>
      </button>
    </div>
    <div class="scrub-wrap">
      <span id="time-now">0:00</span>
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="scrub-fill" id="scrub-fill"></div>
      </div>
      <span id="time-dur">0:00</span>
    </div>
    <div class="dock-tools">
      <label class="vol">
        <span class="sr">Volume</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.86" />
      </label>
      <button type="button" data-act="like-current" id="like-btn" aria-label="Save to liked">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.4 2.4 8.1C1.2 6.9 1.3 4.8 2.7 3.6c1.2-1 3-1 4.1.2L8 5l1.2-1.2c1.1-1.2 2.9-1.2 4.1-.2 1.4 1.2 1.5 3.3.3 4.5L8 13.4z"/></svg>
      </button>
      <button type="button" data-act="queue" aria-label="Queue">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.2h12v1.3H2zM2 7.3h12v1.3H2zM2 11.5h8v1.3H2z"/></svg>
        <em id="q-count">0</em>
      </button>
      <button type="button" data-act="more" aria-label="More" id="more-btn">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.2" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.8" cy="8" r="1.2"/></svg>
      </button>
    </div>
  </footer>

  <div id="scrim" class="scrim" hidden data-act="close-overlays"></div>

  <aside id="queue" class="drawer" data-open="false" aria-label="Queue">
    <header class="drawer-bar">
      <strong>Queue</strong>
      <button type="button" data-act="clear-queue">Clear</button>
      <button type="button" data-act="close-queue">Close</button>
    </header>
    <div id="queue-body"></div>
  </aside>

  <div id="now" class="now" data-open="false" role="dialog" aria-label="Now playing">
    <div class="now-bar">
      <button type="button" data-act="close-now">Close</button>
      <span id="now-kicker" class="kicker"></span>
    </div>
    <div id="now-body"></div>
  </div>

  <div id="popover" class="popover" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <div id="monitor" class="monitor" hidden>
    <div class="bezel"><div id="yt-player"></div></div>
    <div class="chin"><span>picture</span><i class="rec"></i></div>
  </div>

  <audio id="audio" preload="none"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
